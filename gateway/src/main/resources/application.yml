server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    discovery:
      client:
        simple:
          # Sin servidor de descubrimiento: las instancias se declaran aqui (en Compose, por variables de entorno).
          instances:
            consulta-publica:
              - uri: ${PUBLICA_1_URL:http://localhost:8082}
              - uri: ${PUBLICA_2_URL:http://localhost:8083}
            servicio-cientifico:
              - uri: ${CIENTIFICO_URL:http://localhost:8081}
    gateway:
      httpclient:
        connect-timeout: 2000        # ms: una instancia caida se detecta rapido
        response-timeout: 10s        # un servicio lento no deja colgado al cliente
      routes:
        # La consulta publica va primero: /api/publico/** tambien coincide con /api/**
        - id: consulta-publica
          uri: lb://consulta-publica
          order: 1
          predicates:
            - Path=/api/publico/**
          filters:
            - name: Retry              # si una instancia falla, la lectura se reintenta en la otra
              args:
                retries: 2
                methods: GET
        - id: servicio-cientifico
          uri: lb://servicio-cientifico
          order: 2
          predicates:
            - Path=/api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway    # /actuator/gateway/routes muestra las rutas activas
  endpoint:
    health:
      probes:
        enabled: true
